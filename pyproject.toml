[project]
name = "screenlog"
version = "0.1.0"
description = "screenpipe sqlite 위에 직접 올린 개인 화면 기록 RAG"
readme = "README.md"
requires-python = ">=3.14"

# 바닐라 RAG에 실제로 필요한 것만. 기능을 얹을 때마다 여기가 늘어난다 —
# 처음부터 FastAPI/pandas/jupyter를 넣어두면 무엇이 왜 필요했는지가 흐려진다.
dependencies = [
    "chromadb>=1.5.9",          # 벡터 저장·검색
    "sentence-transformers>=5.6.0",  # bge-m3 임베딩 (로컬)
    "openai>=2.46.0",           # LLM 호출 (게이트웨이도 openai 규격)
    "python-dotenv>=1.2.2",     # API 키를 코드에 안 박기
    "fastapi>=0.115.0",         # 6단계 웹 서비스
    "uvicorn>=0.32.0",          # FastAPI를 띄우는 서버
    "httpx>=0.27",              # 슬랙 Web API 호출 (openai의 전이 의존성이었지만 직접 써서 명시)
]

# langchain: router/ask/summarize를 langchain_openai로 다시 짠 비교용 버전.
# langgraph: route()/검색/요약은 원본을 그대로 가져다 쓰고, 오케스트레이션(그래프
# 분기·스트리밍)만 새로 짠 버전 — LLM 호출 라이브러리를 바꾼 게 아니라 그래프
# 엔진만 얹은 거라 langgraph 하나만 있으면 된다.
# langgraph-agent: graph.py의 고정 분기에 tool-calling(ReAct) 폴백 하나만
# 얹은 agent.py용. create_react_agent가 langchain의 tool-calling 모델
# 인터페이스를 요구해서 langchain-openai가 추가로 필요하다 — 그래서
# langgraph 기본 extra에 안 넣고 따로 뺐다(fixed 경로만 쓸 땐 이 무게가 불필요).
[project.optional-dependencies]
langchain = ["langchain-core>=0.3", "langchain-openai>=0.3"]
langgraph = ["langgraph>=0.2"]
langgraph-agent = ["langgraph>=0.2", "langchain-core>=0.3", "langchain-openai>=0.3"]
# bm25: eval/ 하이브리드 검색 실험용(Phase 4). 프로덕션 검색 경로(ask.py)는
# 아직 dense뿐이라 이 extra 없이도 그대로 돈다 — 실험이 하이브리드를 채택하면
# 그때 core dependencies로 옮긴다. kiwipiepy는 BM25 토큰화 전에 한국어
# 형태소(조사 분리)를 떼기 위함 — 공백 기준으로만 쪼개면 "코드트리에서"가
# "코드트리"와 안 겹쳐서 키워드 검색의 장점이 무색해진다.
bm25 = ["rank-bm25>=0.2", "kiwipiepy>=0.18"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

# 이게 있어야 uv가 프로젝트를 editable로 설치한다.
# 없으면 `from screenlog... import`가 안 되고, 스크립트마다
# sys.path를 손보게 된다.
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/screenlog", "src/screenlog_langchain", "src/screenlog_langgraph"]
