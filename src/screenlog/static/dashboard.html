<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>screenlog · 물어보기</title>
<meta name="description" content="screenpipe가 쌓은 화면 기록을 검색하고 물어보는 화면.">
<meta property="og:title" content="screenlog · 물어보기">
<meta property="og:description" content="screenpipe가 쌓은 화면 기록을 검색하고 물어보는 화면.">
<meta property="og:image" content="http://43.202.158.8:8000/static/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230d1013'/><rect x='7' y='13' width='5' height='5' rx='1.5' fill='%23f3f5f7'/><rect x='14' y='13' width='5' height='5' rx='1.5' fill='%237d858d'/><rect x='21' y='13' width='4' height='5' rx='1.5' fill='%23474d55'/></svg>">
<link rel="stylesheet" href="/static/tokens.css">
<style>
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--plane); color:var(--ink); font-family:var(--sans); line-height:1.5; -webkit-font-smoothing:antialiased; }
  .wrap{ max-width:1680px; margin:0 auto; padding:0 32px; }
  main{ display:block; padding:40px 0 72px; }

  /* 대화 목록(왼쪽) / 챗봇 / 잔디·최근기록·앱별사용시간(오른쪽) 3단 배치.
     min-width:0을 안 주면 그리드 아이템이 자식(잔디의 min-width:620px)의
     내재 크기만큼 안 줄어들어서, 페이지 전체가 옆으로 밀린다(그리드 blowout).
     챗봇이 메인이라 convlist/side는 좁게 잡는다 — 잔디가 620px보다 좁아지면
     카드 안에서 가로 스크롤이 생기는데, 부가 정보라 스크롤 정도는 감수한다. */
  .layout{ display:grid; grid-template-columns:240px minmax(0,1fr) 340px; gap:24px; align-items:start; }
  @media(max-width:1100px){ .layout{ grid-template-columns:minmax(0,1fr) 340px; } .convlist{ display:none; } }
  @media(max-width:900px){ .layout{ grid-template-columns:1fr; } }
  .main, .side, .convlist{ min-width:0; }

  /* 대화 목록 접기/펼치기 — 토글이 본문 wrap(#mainwrap)에 .no-convlist를
     붙였다 뗐다 한다. nav도 .wrap을 쓰므로 클래스가 아니라 id로 콕 집는다. */
  #mainwrap.no-convlist .layout{ grid-template-columns:minmax(0,1fr) 340px; }
  #mainwrap.no-convlist .convlist{ display:none; }

  /* side는 부가 패널이라 카드 패딩/헤더를 더 압축한다 */
  .side .card{ padding:14px 16px 16px; }
  .side .card h2{ font-size:13.5px; }
  .side{ display:flex; flex-direction:column; gap:12px; }

  /* 대화 목록 사이드바 */
  .convlist{ display:flex; flex-direction:column; gap:4px; }
  .convnew{ display:flex; align-items:center; gap:8px; background:var(--surface); border:1px dashed var(--border);
            border-radius:9px; padding:9px 12px; font-size:13px; color:var(--ink-2); cursor:pointer; margin-bottom:8px; }
  .convnew:hover{ background:var(--surface-2); border-color:var(--baseline); }
  .convitem{ padding:9px 10px; border-radius:8px; font-size:13px; color:var(--ink-2); cursor:pointer;
             white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .convitem:hover{ background:var(--surface-2); }
  .convitem.active{ background:var(--surface-2); color:var(--ink); font-weight:600; }

  /* 내비/워드마크/버튼 공통 스타일은 tokens.css에 있다. 대화 목록
     토글(사이드바 아이콘 버튼)만 이 페이지 전용이라 여기 남긴다. */
  .icon-btn{ background:none; border:0; color:var(--muted); cursor:pointer; padding:6px; border-radius:6px;
             display:flex; align-items:center; }
  .icon-btn:hover{ color:var(--ink); background:var(--surface-2); }

  /* 채팅 시작 전 — 인사말 + 입력창을 세로 중앙에 놓는다. 질문을 하나라도
     보내면(createTurn) .empty를 떼서 평소의 "로그 위 / 입력창 아래" 배치로
     돌아간다. */
  .chatshell.empty{ display:flex; flex-direction:column; justify-content:center; min-height:56vh; }
  .chatshell.empty .chatlog{ display:none; }
  .chatshell.empty .greeting{ display:block; text-align:center; font-size:21px; color:var(--ink-2); margin:0 0 20px; }
  .chatshell:not(.empty) .greeting{ display:none; }

  section{ margin-top:16px; }
  .card{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:20px 22px 22px; }
  .card-head{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .card h2{ font-size:15.5px; font-weight:620; margin:0; }
  .card .sub{ font-size:12.5px; color:var(--muted); margin:2px 0 16px; }
  .card .hint{ font-family:var(--mono); font-size:11px; color:var(--muted); }

  .qstatus{ font-family:var(--mono); font-size:12px; color:var(--muted); margin-top:10px; min-height:1em; }
  .qstatus.err{ color:#d03b3b; }

  /* 히어로 — 상단 고정형 질의 바 + 2단 그리드(잔디 / 앱별 사용 시간) */
  .herobar{ display:flex; align-items:center; gap:10px; background:var(--surface); border:1px solid var(--border);
            border-radius:12px; padding:0 16px; height:52px; }
  .herobar input{ flex:1; min-width:0; border:0; background:transparent; color:var(--ink); font-family:var(--sans); font-size:14.5px; }
  .herobar input:focus{ outline:none; }
  .herobar input::placeholder{ color:var(--muted); }
  .herobar .ic{ color:var(--muted); flex:none; }
  .herobar .kbd{ font-family:var(--mono); font-size:11.5px; color:var(--muted); border:1px solid var(--border); border-radius:6px; padding:2px 7px; flex:none; }

  .digest-row{ display:flex; align-items:center; gap:14px; padding:11px 4px; border-top:1px solid var(--border); cursor:pointer; }
  .digest-row:first-child{ border-top:0; }
  .digest-row:hover{ background:var(--surface-2); border-radius:8px; }
  .digest-date{ font-family:var(--mono); font-size:12px; color:var(--muted); min-width:56px; flex:none; line-height:1.4; }
  .digest-text{ flex:1; min-width:0; display:flex; flex-direction:column; gap:3px; }
  .digest-line{ font-size:13px; line-height:1.5; color:var(--ink-2); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .digest-row .chev{ flex:none; color:var(--muted); font-size:15px; }

  /* 채팅 로그 — 턴마다 사용자 말풍선 + 답변(plan/answer/hits)을 쌓는다.
     입력창(herobar)은 항상 로그 아래 고정, 로그가 쌓이면 로그 안쪽만
     스크롤되게 해서 입력창이 밀려 내려가지 않게 한다(챗봇 앱 표준 배치). */
  .chatlog{ display:flex; flex-direction:column; gap:22px; }
  .chatlog:empty{ margin:0; }
  .chatlog:not(:empty){ max-height:78vh; overflow-y:auto; margin-bottom:14px; padding:2px 4px 2px 0; }
  .turn{ display:flex; flex-direction:column; gap:10px; }
  .msg-user{ align-self:flex-end; max-width:80%; background:var(--accent); color:#fff;
             padding:10px 14px; border-radius:14px 14px 4px 14px; font-size:14px;
             line-height:1.5; white-space:pre-wrap; }
  .msg-bot{ display:flex; flex-direction:column; gap:10px; }
  .msg-bot .answer{ border-radius:4px 14px 14px 14px; }

  /* 라우팅 결과(app/hour/기간) — "app=null intent=정리" 같은 내부 필드명
     대신 자연어 한 줄로만 보여준다. 필터가 하나도 안 걸린 보통 질문에는
     아예 아무것도 안 보여줘야(=:empty) 매 턴마다 이 줄이 안 생긴다. */
  .plan-badges:empty{ display:none; }
  .plan-caption{ font-size:12.5px; color:var(--muted); }

  /* draft_slack_message가 이번 턴에 호출됐을 때만 채워지는 자리(msg-actions는
     매 턴 항상 만들어지지만 비어있으면 안 보인다) — 채널 입력 + 보내기 버튼. */
  .msg-actions:empty{ display:none; }
  .msg-actions{ display:flex; align-items:center; gap:8px; }
  .slack-channel-input{ flex:0 1 220px; padding:7px 10px; font-size:13px; border-radius:7px;
                         border:1px solid var(--border); background:var(--surface); color:var(--ink); }
  .msg-actions .hint{ font-size:12.5px; color:var(--muted); }
  .answer{ font-size:14.5px; line-height:1.65; background:var(--surface-2); border:1px solid var(--border); border-radius:10px; padding:14px 16px; }
  .answer p{ margin:0 0 12px; }
  .answer p:last-child{ margin-bottom:0; }
  .answer ul{ margin:0 0 12px; padding-left:19px; }
  .answer ul:last-child{ margin-bottom:0; }
  .answer ul ul{ margin:4px 0; padding-left:18px; }
  .answer li{ margin-bottom:5px; }
  .answer li::marker{ color:var(--muted); }
  .answer b{ font-weight:650; }
  .answer .time{ font-family:var(--mono); font-size:.92em; color:var(--accent); }

  /* 날짜/기간별 아코디언 */
  .answer details.daybox{ border:1px solid var(--border); border-radius:8px; margin:0 0 8px; background:var(--surface); overflow:hidden; }
  .answer details.daybox:last-child{ margin-bottom:0; }
  .answer details.daybox summary{ cursor:pointer; list-style:none; padding:9px 12px; font-weight:640; font-size:13px; color:var(--ink-2); background:var(--surface-3); user-select:none; }
  .answer details.daybox summary::-webkit-details-marker{ display:none; }
  .answer details.daybox summary::before{ content:"▸"; display:inline-block; width:1em; margin-right:4px; color:var(--muted); transition:transform .15s; }
  .answer details.daybox[open] summary::before{ transform:rotate(90deg); }
  .answer .daybox-body{ padding:10px 12px 2px; }
  .answer .daybox-body > *:last-child{ margin-bottom:0; }
  .hits{ display:flex; flex-direction:column; gap:8px; }
  .hit{ padding:10px 12px; border:1px solid var(--border); border-radius:9px; background:var(--surface); }
  .hit-head{ display:flex; gap:8px; align-items:center; flex-wrap:wrap; margin-bottom:5px; }
  .hit .happ{ font-size:12.5px; color:var(--ink-2); font-weight:600; display:flex; align-items:center; gap:6px; }
  .hit .hmeta{ font-family:var(--mono); font-size:11.5px; color:var(--muted); }
  .hit .hwin{ font-size:11.5px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:220px; }
  .hit .hex{ font-size:12.5px; color:var(--ink-2); line-height:1.5; max-height:4.5em; overflow:hidden; }
  .warn{ font-size:11px; padding:2px 8px; border-radius:999px; background:var(--warn-bg); color:var(--warn); border:1px solid var(--border); }

  /* 근거 — 기본 접힘, 한 줄 요약만 보이다가 클릭하면 카드 펼쳐짐 */
  .hitsbox{ border:1px solid var(--border); border-radius:9px; overflow:hidden; background:var(--surface); }
  .hitsbox summary{ cursor:pointer; list-style:none; padding:8px 12px; font-size:12.5px;
                     color:var(--muted); user-select:none; }
  .hitsbox summary::-webkit-details-marker{ display:none; }
  .hitsbox summary::before{ content:"▸"; display:inline-block; width:1em; margin-right:4px;
                             color:var(--muted); transition:transform .15s; }
  .hitsbox[open] summary::before{ transform:rotate(90deg); }
  .hitsbox .hits-list{ padding:0 10px 10px; display:flex; flex-direction:column; gap:8px; }

  /* 스트리밍 로딩 스켈레톤 */
  .skeleton{ background:linear-gradient(90deg,var(--surface-2) 25%,var(--surface-3) 37%,var(--surface-2) 63%); background-size:400% 100%; animation:sk-pulse 1.4s ease infinite; border-radius:7px; }
  @keyframes sk-pulse{ 0%{background-position:100% 50%} 100%{background-position:0 50%} }
  .sk-line{ height:13px; margin-bottom:9px; }
  .sk-line:last-child{ margin-bottom:0; }
  .sk-hit{ height:58px; }

  /* 타이핑 커서 */
  .cursor{ animation:cur-blink .9s steps(1) infinite; }
  @keyframes cur-blink{ 0%,49%{opacity:1} 50%,100%{opacity:0} }

  /* 잔디 */
  .cal-scroll{ overflow-x:auto; }
  .cal{ min-width:620px; }
  .cal-row{ display:grid; grid-template-columns:52px 1fr; align-items:center; gap:10px; margin-bottom:4px; }
  .cal-row .dlab{ font-family:var(--mono); font-size:11.5px; color:var(--ink-2); text-align:right; }
  .cal-row .dlab .wd{ color:var(--muted); }
  .cal-cells{ display:grid; grid-template-columns:repeat(24,1fr); gap:3px; }
  .cell{ aspect-ratio:1; border-radius:3px; background:var(--surface-3); }
  .cal-hours{ display:grid; grid-template-columns:52px 1fr; gap:10px; margin-top:6px; }
  .cal-hours .hx{ display:grid; grid-template-columns:repeat(24,1fr); gap:3px; font-family:var(--mono); font-size:9px; color:var(--muted); }
  .cal-hours .hx span{ text-align:center; }
  .cal-scale{ display:flex; align-items:center; gap:6px; font-family:var(--mono); font-size:11px; color:var(--muted); margin-top:12px; justify-content:flex-end; }
  .cal-scale .cell{ width:13px; height:13px; aspect-ratio:auto; }

  /* 막대(앱별 사용 시간) */
  .bars{ display:flex; flex-direction:column; gap:10px; }
  .bar-row{ display:grid; grid-template-columns:92px 1fr 72px; align-items:center; gap:12px; }
  .bar-row .name{ font-size:13px; color:var(--ink-2); text-align:right; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .track{ height:14px; background:var(--surface-3); border-radius:0 4px 4px 0; overflow:hidden; }
  .fill{ height:100%; border-radius:0 4px 4px 0; }
  .bar-row .val{ font-family:var(--mono); font-size:12.5px; text-align:right; font-variant-numeric:tabular-nums; }
  .bar-row .val .u{ color:var(--muted); font-size:11px; }

  #tip{ position:fixed; z-index:50; pointer-events:none; opacity:0; transition:opacity .1s; background:var(--ink); color:var(--plane); font-size:12px; padding:7px 10px; border-radius:7px; box-shadow:0 6px 20px rgba(0,0,0,.28); }
  #tip .tt{ font-weight:600; }
  #tip .td{ font-family:var(--mono); opacity:.82; margin-top:2px; }
</style>
</head>
<body>
<header class="nav">
  <div class="wrap">
    <div style="display:flex; align-items:center; gap:12px;">
      <button class="icon-btn" id="convtoggle" type="button" title="대화 목록" aria-label="대화 목록 토글">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="16" rx="2"></rect><line x1="9" y1="4" x2="9" y2="20"></line>
        </svg>
      </button>
      <a class="mark" href="/">
        <span class="glyph"><i></i><i></i><i></i></span>
        screenlog
      </a>
    </div>
    <nav class="navlinks">
      <a href="/dashboard" class="on">물어보기</a>
      <a href="/explore">탐색</a>
      <a class="btn btn-primary btn-sm" href="/download/">다운로드</a>
    </nav>
  </div>
</header>

<main>
<div class="wrap" id="mainwrap">
  <div class="layout">
    <aside class="convlist" id="convlist">
      <div class="convnew" id="convnew">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
        새 채팅
      </div>
      <div id="convitems"></div>
    </aside>

    <div class="main">
      <div class="chatshell empty" id="chatshell">
        <div class="greeting" id="greeting">오늘은 뭘 하셨나요?</div>
        <div class="chatlog" id="chatlog"></div>
        <form id="qform" class="herobar">
          <svg class="ic" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input id="qinput" type="text" autocomplete="off" autofocus
                 placeholder="무엇이든 물어보세요 — 어제 뭐 했지? · 이번 주 정리해줘">
          <span class="kbd">Enter</span>
          <button type="submit" id="qbtn" style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0;">질의</button>
        </form>
        <div class="qstatus" id="qstatus"></div>
      </div>
    </div>

    <aside class="side">
      <section class="card">
        <div class="card-head"><h2>활동 잔디</h2><span class="hint" id="cal-hint"></span></div>
        <div class="cal-scroll"><div class="cal" id="cal"></div></div>
        <div class="cal-scale">적음 <span class="cell" data-l="0"></span><span class="cell" data-l="1"></span><span class="cell" data-l="2"></span><span class="cell" data-l="3"></span><span class="cell" data-l="4"></span> 많음</div>
      </section>

      <section class="card">
        <div class="card-head"><h2>최근 기록</h2><span class="hint">날짜를 누르면 그날 얘기를 이어서 물어요</span></div>
        <div class="digest" id="digest"></div>
      </section>

      <section class="card">
        <div class="card-head"><h2>앱별 사용 시간</h2><span class="hint" id="todaybars-date"></span></div>
        <div class="bars" id="todaybars"></div>
      </section>
    </aside>
  </div>
</div>
</main>

<div id="tip"><div class="tt"></div><div class="td"></div></div>

<script>
const LABEL = {"zoom.us":"Zoom","Google Chrome":"Chrome"};
const lab = a => LABEL[a] || a;
const $ = s => document.querySelector(s);
const el = (t,c,txt)=>{ const e=document.createElement(t); if(c)e.className=c; if(txt!=null)e.textContent=txt; return e; };
const pad2 = n => String(n).padStart(2,"0");
const esc = s => String(s??"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

let APP_SLOT = {};
const colorVar = a => APP_SLOT[a] || "var(--muted)";

const tip=$("#tip");
function showTip(e,t,d){ tip.querySelector(".tt").textContent=t; tip.querySelector(".td").textContent=d||""; tip.style.opacity=1; moveTip(e); }
function moveTip(e){ const p=14; let x=e.clientX+p,y=e.clientY+p; const r=tip.getBoundingClientRect();
  if(x+r.width>innerWidth-8)x=e.clientX-r.width-p; if(y+r.height>innerHeight-8)y=e.clientY-r.height-p;
  tip.style.left=x+"px"; tip.style.top=y+"px"; }
function bindTip(n,t,d){ n.addEventListener("mouseenter",e=>showTip(e,t,d)); n.addEventListener("mousemove",moveTip); n.addEventListener("mouseleave",()=>tip.style.opacity=0); }

// ---------- 대화 목록 사이드바 토글 ----------
// 접힌 상태를 localStorage에 기억해서 새로고침해도 유지되게 한다.
const wrapEl=$("#mainwrap"), convtoggle=$("#convtoggle");
if(localStorage.getItem("convlist-collapsed") === "1") wrapEl.classList.add("no-convlist");
convtoggle.addEventListener("click", ()=>{
  wrapEl.classList.toggle("no-convlist");
  localStorage.setItem("convlist-collapsed", wrapEl.classList.contains("no-convlist") ? "1" : "0");
});

// ---------- 질의 (채팅 로그) ----------
const qform=$("#qform"), qinput=$("#qinput"), qbtn=$("#qbtn"), qstatus=$("#qstatus"),
      chatlog=$("#chatlog"), chatshell=$("#chatshell");

// 팔로우업 맥락("그날"/"더 자세히" 등)은 더 이상 브라우저가 안 들고 있는다 —
// 서버가 conversation_id로 자기 DB(chat_history)를 직접 읽어서 만든다.
// 예전엔 CONV_HISTORY라는 배열로 브라우저가 최근 대화를 들고 있다가 매
// 질문마다 통째로 재전송했는데, 서버가 이미 저장해둔 걸 다시 보내는
// 중복이었다 — conversation_id 하나만 보내면 서버가 알아서 찾는다.

// 지금 이어가고 있는 대화 id. null이면 "아직 서버에 대화가 안 만들어짐"이라,
// 서버가 첫 질문을 받을 때 하나 발급해서 SSE로 돌려준다(askStream에서 채움).
let CURRENT_CONV_ID = null;

// 질문마다 채팅 로그에 새 턴(사용자 말풍선 + 답변 영역)을 쌓는다. 이전 답변은
// 안 지워지고 계속 쌓이는 게 이전(질문 하나 = 답변 영역 하나 덮어쓰기)과의 차이.
function createTurn(question){
  chatshell.classList.remove("empty");   // 첫 턴이 생기는 순간 센터드 배치를 풀고 평소 배치로

  const turn = el("div","turn");
  turn.append(el("div","msg-user", question));

  const bot = el("div","msg-bot");
  const badges = el("div","plan-badges");
  const answer = el("div","answer");
  const hits = el("div","hits");
  const actions = el("div","msg-actions");
  bot.append(badges, answer, hits, actions);
  turn.append(bot);

  chatlog.append(turn);
  chatlog.scrollTop = chatlog.scrollHeight;   // 새 턴은 로그 안쪽 스크롤 바닥으로
  return {badges, answer, hits, actions};
}

qform.addEventListener("submit", async e=>{
  e.preventDefault();
  const question = qinput.value.trim();
  if(!question) return;

  qinput.value = "";
  qbtn.disabled=true; qstatus.className="qstatus";

  const els = createTurn(question);
  try{
    await askStream(question, els);
  }catch(err){
    qstatus.className="qstatus err"; qstatus.textContent="오류: "+err.message;
    els.answer.innerHTML = `<p style="color:#d03b3b">오류: ${esc(err.message)}</p>`;
  }finally{ qbtn.disabled=false; qinput.focus(); }
});

// /api/ask/stream을 SSE로 읽어서 plan/hits는 오는 즉시, 답변은 토큰 올 때마다 이어붙여 그린다.
// 팔로우업 맥락은 conversation_id만 보내면 서버가 자기 DB에서 알아서 찾는다.
// els는 createTurn()이 만든 이번 턴의 DOM 자리(badges/answer/hits) — 매번 새 턴이라
// #answer 같은 전역 id 대신 이걸 채운다.
async function askStream(question, els){
  const res = await fetch("/api/ask/stream", {
    method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({ question, conversation_id: CURRENT_CONV_ID }),
  });
  if(!res.ok) throw new Error("서버 오류 "+res.status);

  showSkeleton(els);

  let usedSlackDraft = false;   // 이 턴에서 draft_slack_message가 호출됐는지 — 끝나고 "보내기" 버튼 노출 여부

  const reader = res.body.getReader();
  const decoder = new TextDecoder();
  let buffer = "";       // 아직 "\n\n"으로 안 끊긴, 처리 대기 중인 raw 조각
  let pending = "";      // 서버에서 도착했지만 아직 화면에 안 그린 답변 텍스트
  let displayed = "";    // 실제로 화면에 그려진 답변 텍스트
  let networkDone = false;

  // 서버는 토큰을 문장 덩어리로 뭉텅이째 보내서, 도착 즉시 그리면 뚝뚝 끊겨 보인다.
  // 그래서 도착한 텍스트는 pending에 쌓아만 두고, 별도 타이머로 조금씩 꺼내
  // 화면(displayed)에 채워서 타이핑처럼 고르게 흘러나오게 만든다.
  //
  // 한 틱에 그리는 글자 수는 남은 양에 비례시킨다. 고정 2글자로 두면 캐시된
  // 답(요약이 즉시 도착)이 4,600자쯤 될 때 화면에 다 뜨는 데만 30초가 걸려서,
  // 백엔드를 빠르게 만든 이득을 애니메이션이 통째로 먹어버린다. 스트리밍처럼
  // 조금씩 도착할 때는 남은 양이 적어 자연히 최소값(2글자)으로 떨어진다.
  //
  // 주의: 매 틱 "남은 양" 기준으로 다시 나누므로 TYPE_TICKS번에 끝나지 않고
  // 비율만큼 기하급수로 줄어든다(실측: 90으로 두니 380틱 ≈ 5.7초). 20이면
  // 4,600자가 약 113틱 ≈ 1.7초에 수렴한다.
  const TYPE_MS = 15, TYPE_TICKS = 20, TYPE_MIN = 2;
  let timer = null;
  const typingDone = new Promise(resolve=>{
    timer = setInterval(()=>{
      const remaining = pending.length - displayed.length;
      if(remaining > 0){
        const step = Math.max(TYPE_MIN, Math.ceil(remaining / TYPE_TICKS));
        displayed += pending.slice(displayed.length, displayed.length + step);
        renderAnswer(els, displayed, true);   // true = 아직 쓰는 중 -> 커서 표시
        chatlog.scrollTop = chatlog.scrollHeight;   // 답이 길어지는 동안 계속 바닥에 붙어있게
      }else if(networkDone){
        clearInterval(timer);
        renderAnswer(els, displayed, false);  // 다 끝남 -> 커서 제거
        chatlog.scrollTop = chatlog.scrollHeight;
        resolve();
      }
    }, TYPE_MS);
  });

  try{
    while(true){
      const {value, done} = await reader.read();
      if(done) break;

      buffer += decoder.decode(value, {stream:true});

      const parts = buffer.split("\n\n");
      buffer = parts.pop();   // 마지막 조각은 아직 안 끝났을 수 있어 버퍼에 남긴다

      for(const part of parts){
        if(!part.startsWith("data: ")) continue;
        const payload = JSON.parse(part.slice(6));

        if(payload.type === "conversation"){
          // 서버가 새 대화면 여기서 처음 id를 발급해 알려준다. 사이드바 목록도
          // 새 항목이 생겼으니(또는 기존 항목이 맨 위로 올라왔으니) 새로고침한다.
          const isNew = CURRENT_CONV_ID !== payload.id;
          CURRENT_CONV_ID = payload.id;
          if(isNew) loadConversations();
        }else if(payload.type === "plan"){
          renderPlan(els, payload.plan);
        }else if(payload.type === "hits"){
          renderHits(els, payload.hits);
        }else if(payload.type === "tool_start"){
          // 복합 질문(에이전트 경로)에서만 온다. 답이 나올 때까지 도구 여러 개를
          // 돌 수 있어서, 스켈레톤만 띄워두면 몇 초씩 먹통처럼 보인다 — 지금 뭘
          // 확인 중인지 보여준다. token이 오면 renderAnswer()가 이 자리를
          // 자연스럽게 덮어써서 따로 지우는 코드가 필요 없다.
          renderToolStatus(els, payload.tools, true);
          if(payload.tools.includes("draft_slack_message")) usedSlackDraft = true;
        }else if(payload.type === "tool_done"){
          renderToolStatus(els, payload.tools, false);
        }else if(payload.type === "token"){
          pending += payload.text;
        }else if(payload.type === "error"){
          throw new Error(payload.message);
        }
        // "done"은 별도 처리 없음 — 스트림이 곧 자연스럽게 끝난다.
      }
    }
    networkDone = true;
    await typingDone;   // 타이핑 애니메이션이 pending을 다 그릴 때까지 기다렸다가 반환
    if(usedSlackDraft) renderSlackSendAction(els, pending);
  }finally{
    clearInterval(timer);   // 에러로 중간에 빠져나가도 타이머는 반드시 정리
  }
}

// draft_slack_message가 이번 턴에 호출됐을 때만 answer 아래에 노출한다.
// 채널을 입력받아 /api/slack/send를 직접 호출한다 — LLM은 이 버튼의 존재도,
// 클릭 여부도 모른다. 실제 전송은 여기(사용자의 명시적 클릭)에서만 일어난다.
function renderSlackSendAction(els, text){
  const box = els.actions;
  box.innerHTML = "";

  const channelInput = document.createElement("input");
  channelInput.type = "text";
  channelInput.className = "slack-channel-input";
  channelInput.placeholder = "채널 ID 또는 #채널명";

  const sendBtn = el("button","btn btn-primary btn-sm","슬랙으로 보내기");
  sendBtn.type = "button";

  const status = el("span","hint");

  sendBtn.addEventListener("click", async ()=>{
    const channel = channelInput.value.trim();
    if(!channel){ status.textContent = "채널을 입력하세요"; return; }

    sendBtn.disabled = true; channelInput.disabled = true;
    status.textContent = "전송 중…";
    try{
      const res = await fetch("/api/slack/send", {
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({ text, channel }),
      });
      const data = await res.json();
      if(!res.ok) throw new Error(data.detail || ("서버 오류 "+res.status));
      status.textContent = `#${channel}에 전송 완료`;
      channelInput.remove(); sendBtn.remove();
    }catch(err){
      status.textContent = "전송 실패: "+err.message;
      sendBtn.disabled = false; channelInput.disabled = false;
    }
  });

  box.append(channelInput, sendBtn, status);
}

// plan(app/hour/기간)이 걸렸을 때만 한 줄 캡션으로 보여준다. "app=null
// intent=정리" 같은 내부 필드명은 사용자 언어가 아니라서, 실제로 걸린
// 필터만 자연어로 이어붙인다. intent(검색/정리/비교/집계)는 라우팅
// 내부 분기일 뿐 사용자가 알 필요가 없어서 아예 안 보여준다. 필터가
// 하나도 없으면(대부분의 평범한 질문) 캡션 자체를 안 만든다.
function renderPlan(els, plan){
  const badges=els.badges; badges.innerHTML="";

  const parts = [];
  if(plan.app) parts.push(`${plan.app}에서`);   // el()이 textContent로 넣어서 esc() 불필요
  if(plan.hour_start != null) parts.push(`${plan.hour_start}시~${plan.hour_end}시`);
  const totalDates = (plan.periods || []).reduce((n,p)=>n+p.dates.length, 0);
  if(totalDates > 1) parts.push(`최근 ${totalDates}일`);

  if(parts.length) badges.append(el("div","plan-caption", parts.join(" · ")));
}

// 도구 이름(내부 함수명)을 사용자 언어로. 새 도구 추가하면 여기도 같이 늘린다.
const TOOL_LABELS = {
  search_events: "검색", count_events: "집계", summarize_days: "정리",
  compare_days: "비교", draft_handover_doc: "인수인계 문서 작성",
  draft_slack_message: "슬랙 메시지 초안 작성",
};

// 복합 질문(에이전트 경로)에서 도구를 부르는 동안 "지금 뭘 하고 있는지"를
// answer 자리에 임시로 보여준다. token이 도착하면 renderAnswer()가 이 자리를
// 덮어쓰므로 여기서 따로 지우지 않는다 — showSkeleton()과 같은 패턴.
function renderToolStatus(els, tools, running){
  const names = tools.map(t => TOOL_LABELS[t] || t).join(", ");
  const text = running ? `${names} 확인하는 중…` : `${names} 확인 완료`;
  els.answer.innerHTML = `<div class="plan-caption">${esc(text)}</div>`;
}

// 로딩 중임을 보여주는 스켈레톤 placeholder. hits/answer가 오면 각자 innerHTML을
// 덮어써서 자연스럽게 사라진다 — 별도로 지우는 코드가 필요 없다.
function showSkeleton(els){
  els.badges.innerHTML = "";
  els.answer.innerHTML =
    '<div class="skeleton sk-line" style="width:92%"></div>' +
    '<div class="skeleton sk-line" style="width:78%"></div>' +
    '<div class="skeleton sk-line" style="width:55%"></div>';
  els.hits.innerHTML =
    '<div class="skeleton sk-hit" style="margin-bottom:8px"></div>' +
    '<div class="skeleton sk-hit" style="margin-bottom:8px"></div>' +
    '<div class="skeleton sk-hit"></div>';
}

// "14시 30분"/"14시30분" 같은 시각 표현을 강조 span으로 감싼다. bold 처리
// 뒤에 돌리므로 <b> 태그와는 안 겹친다("시"/숫자만 매칭해서 태그 문법과 충돌 안 함).
function highlightTime(html){
  return html.replace(/\d{1,2}시(?:\s?\d{1,2}분)?/g, m => `<span class="time">${m}</span>`);
}

function isDayHeader(line){ return /^\[\d{4}-\d{2}-\d{2}\([^)]*\)\]$/.test(line.trim()); }
function isPeriodHeader(line){ return /^###\s+/.test(line.trim()); }

// "* " 불릿 리스트(중첩 2단까지)와 일반 문단(<p>)만 처리한다. 헤더 판별은
// mdLite()가 미리 끝내고, 여기엔 헤더 없는 본문 줄만 들어온다.
function renderBlock(lines){
  let html = "";
  let ulOpen = false, subOpen = false;
  let para = [];   // 리스트가 아닌 일반 줄을 모아뒀다가 <p>로 묶는다

  const flushPara = () => {
    if(para.length){ html += `<p>${para.join("<br>")}</p>`; para = []; }
  };
  const closeLists = () => {
    if(subOpen){ html += "</ul>"; subOpen = false; }
    if(ulOpen){ html += "</ul>"; ulOpen = false; }
  };

  for(const raw of lines){
    if(raw.trim() === ""){ flushPara(); closeLists(); continue; }

    const m = raw.match(/^(\s*)\*\s+(.*)$/);
    if(m){
      flushPara();
      const nested = m[1].length >= 2;
      if(!ulOpen){ html += "<ul>"; ulOpen = true; }
      if(nested && !subOpen){ html += "<ul>"; subOpen = true; }
      if(!nested && subOpen){ html += "</ul>"; subOpen = false; }
      html += `<li>${m[2]}</li>`;
    }else{
      closeLists();
      para.push(raw);
    }
  }
  flushPara();
  closeLists();
  return html;
}

// **bold** + 시각 강조 + 불릿 리스트를 처리하고, "[날짜(요일)]"/"### 기간"
// 헤더를 만나면 그 아래 내용을 접었다 펼 수 있는 <details>로 묶는다.
// esc()로 먼저 이스케이프해야 사용자가 마크다운 문법처럼 보이는 텍스트를
// 넣어도 HTML 인젝션이 안 된다 — 그 뒤에 만든 태그들만 실제 HTML이다.
function mdLite(text){
  const bolded = esc(text).replace(/\*\*(.+?)\*\*/gs, "<b>$1</b>");
  const lines = highlightTime(bolded).split("\n");

  if(!lines.some(l => isDayHeader(l) || isPeriodHeader(l))){
    return renderBlock(lines);   // 헤더가 없는 단일 답변(검색 intent 등)은 그냥 렌더링
  }

  let html = "";
  let preLines = [];   // 첫 헤더가 나오기 전 줄(보통 없음)
  let curHeader = null;
  let curLines = [];

  const flushSection = () => {
    if(curHeader == null) return;
    html += `<details class="daybox" open><summary>${curHeader}</summary>` +
            `<div class="daybox-body">${renderBlock(curLines)}</div></details>`;
    curLines = [];
  };

  for(const raw of lines){
    if(isDayHeader(raw) || isPeriodHeader(raw)){
      flushSection();
      curHeader = raw.trim().replace(/^\[|\]$/g, "").replace(/^###\s+/, "");
      continue;
    }
    (curHeader == null ? preLines : curLines).push(raw);
  }
  flushSection();

  return renderBlock(preLines) + html;
}

// showCursor가 true면 끝에 깜빡이는 타이핑 커서를 붙인다.
function renderAnswer(els, text, showCursor){
  els.answer.innerHTML = mdLite(text) + (showCursor ? '<span class="cursor">▍</span>' : "");
}

// 근거 카드를 기본 접힌 <details>로 감싼다. 답변마다 카드가 쫙 펼쳐지면 채팅
// 흐름을 근거가 다 잡아먹어서, "한 줄 요약 + 클릭하면 검증 가능"으로 바꿨다 —
// 숨기는 게 아니라 항상 한 클릭 거리에 있게 하는 것이 핵심(신뢰는 유지, 시각적
// 무게만 줄임).
function renderHits(els, hits){
  const box=els.hits; box.innerHTML="";
  if(!hits.length){
    // "근거 없음" 문구를 띄웠었는데, 에이전트 경로(agent.py)는 실제로 검색을
    // 했어도 hits를 항상 빈 배열로 보내므로(아직 안 고친 부분) 매번 "근거
    // 없음"이 잘못 뜬다. 고정 경로(정리/비교/집계)도 원래 hits가 없는 게
    // 정상이라 이 경우엔 문구 자체가 필요 없다 — 그냥 아무것도 안 보여준다.
    return;
  }

  const appCounts = {};
  for(const h of hits) appCounts[h.app] = (appCounts[h.app]||0) + 1;
  const topApp = Object.entries(appCounts).sort((a,b)=>b[1]-a[1])[0][0];

  const details = document.createElement("details");
  details.className = "hitsbox";
  const summary = document.createElement("summary");
  summary.textContent = `근거 ${hits.length}개 · ${lab(topApp)} 중심`;
  details.append(summary);

  const list = el("div","hits-list");
  for(const h of hits){
    const card=el("div","hit");
    const head=el("div","hit-head");
    const app=el("div","happ");
    const sw=el("span","sw"); sw.style.background=colorVar(h.app);
    app.append(sw, document.createTextNode(lab(h.app)));
    head.append(app, el("span","hmeta", h.start.slice(5,16).replace("T"," ")+" · "+h.distance));
    if(h.window) head.append(el("span","hwin", h.window));
    if(h.ai_app) head.append(el("span","warn","AI 화면 · 재귀 오염 주의"));
    card.append(head, el("div","hex", h.excerpt));
    list.append(card);
  }
  details.append(list);
  box.append(details);
}

// ---------- 대화 목록 (왼쪽 사이드바) ----------
const convitems=$("#convitems");

async function loadConversations(){
  const data = await fetch("/api/conversations").then(r=>r.json());
  convitems.innerHTML = "";
  data.conversations.forEach(c=>{
    const item = el("div", "convitem" + (c.id===CURRENT_CONV_ID ? " active" : ""), c.title);
    item.addEventListener("click", ()=>openConversation(c.id));
    convitems.append(item);
  });
}
loadConversations();

// 저장된 대화를 다시 열어서 채팅창에 그대로 재생한다. plan/hits는 애초에
// 저장 대상이 아니라(chat_history.py 주석 참고) 배지/근거 없이 답변 텍스트만
// 다시 그린다. 팔로우업 맥락은 CURRENT_CONV_ID만 맞으면 서버가 알아서
// 찾으므로, 여기서 따로 복원해둘 배열이 없다.
async function openConversation(id){
  if(id === CURRENT_CONV_ID) return;
  const data = await fetch(`/api/conversations/${id}`).then(r=>r.json());

  CURRENT_CONV_ID = id;
  chatlog.innerHTML = "";
  chatshell.classList.remove("empty");

  const msgs = data.messages;
  for(let i=0; i<msgs.length; i+=2){
    const question = msgs[i]?.content ?? "";
    const answer = msgs[i+1]?.content ?? "";
    const els = createTurn(question);
    renderAnswer(els, answer, false);
    els.hits.innerHTML = "";
  }

  document.querySelectorAll(".convitem.active").forEach(n=>n.classList.remove("active"));
  loadConversations();   // active 표시 갱신
}

$("#convnew").addEventListener("click", ()=>{
  CURRENT_CONV_ID = null;
  chatlog.innerHTML = "";
  chatshell.classList.add("empty");
  document.querySelectorAll(".convitem.active").forEach(n=>n.classList.remove("active"));
  qinput.focus();
});

// ---------- 최근 기록 ----------
// 날짜별 하루 요약 피드. summarize_day()가 만든 "* HH시MM분 - 내용" 불릿을
// /api/digest로 그대로 받아온다 — 서버는 안 건드리고, 여기서 한 줄로 뭉개던
// 걸 상위 몇 개만 짧은 줄로 나눠 보여주는 걸로 바꾼다(가독성 문제라 LLM을
// 더 부르지 않고 파싱만으로 해결).
const DIGEST_LINES = 3;   // 카드 하나에 보여줄 항목 수

// "* 09시 04분 - 내용." / "* 22시 19분 ~ 22시 30분 - 내용." 한 줄에서
// 시각(단일 또는 범위) 프리픽스를 떼고 내용만 남긴다.
const TIME_PREFIX = /^\d{1,2}시\s?\d{1,2}분(\s*~\s*\d{1,2}시\s?\d{1,2}분)?\s*-\s*/;
function bulletText(line){
  return line.replace(/^\*\s*/, "").replace(TIME_PREFIX, "").trim();
}

async function loadDigest(){
  const box=$("#digest");
  const data = await fetch("/api/digest?n=5").then(r=>r.json());
  box.innerHTML="";
  if(!data.days.length){ box.append(el("div","hint","기록 없음")); return; }
  data.days.forEach(d=>{
    const row=el("div","digest-row");
    const [ , mo, da ] = d.date.split("-");
    const date=el("div","digest-date");
    date.innerHTML=`${+mo}.${+da}<br><span style="color:var(--muted)">${esc(d.weekday_kr)}</span>`;

    const bullets = d.summary.split("\n").map(l=>l.trim()).filter(l=>l.startsWith("*"));
    const text=el("div","digest-text");
    if(!bullets.length){
      text.append(el("div","digest-line", d.summary.trim() || "기록 없음"));
    }else{
      bullets.slice(0, DIGEST_LINES).forEach(b=> text.append(el("div","digest-line", bulletText(b))));
      if(bullets.length > DIGEST_LINES){
        text.append(el("div","digest-line", `그 외 ${bullets.length - DIGEST_LINES}건 더`));
      }
    }

    row.append(date, text, el("div","chev","›"));
    // 클릭하면 그 날짜에 대해 물어본 것처럼 채팅으로 이어간다 — 카드가
    // 곧 질문의 지름길이 되게 하는 것이 핵심(잔디 클릭과 같은 패턴).
    row.addEventListener("click", ()=>{
      qinput.value = `${+mo}월 ${+da}일에 뭐 했어?`;
      qform.requestSubmit();
    });
    box.append(row);
  });
}
loadDigest();

// ---------- 히어로(잔디 + 앱별 사용 시간) ----------
(async ()=>{
  const D = await fetch("/api/stats").then(r=>r.json());
  if(!D.dates.length){ qinput.placeholder="색인된 이벤트가 없습니다"; return; }

  D.apps.forEach((a,i)=>{ APP_SLOT[a] = i<8 ? `var(--app-${i+1})` : "var(--muted)"; });

  // 잔디
  const cellMap={};
  D.calendar.forEach(c=>{ (cellMap[c.date]=cellMap[c.date]||{})[c.hour]=c.frames; });
  const calMax=Math.max(...D.calendar.map(c=>c.frames),1);
  const alphaFor = f => f>0 ? (14 + 86*Math.pow(f/calMax,0.6)) : 0;
  const cal=$("#cal");
  D.per_day.forEach(d=>{
    const row=el("div","cal-row");
    const dl=el("div","dlab"); dl.innerHTML=`${esc(d.date.slice(5))}<span class="wd"> ${esc(d.weekday_kr)}</span>`;
    const cc=el("div","cal-cells");
    for(let h=0;h<24;h++){
      const f=(cellMap[d.date]||{})[h]||0;
      const cell=el("div","cell");
      if(f>0) cell.style.background=`color-mix(in srgb, var(--accent) ${alphaFor(f)}%, transparent)`;
      bindTip(cell, `${d.date.slice(5)} ${d.weekday_kr} · ${pad2(h)}시`, f>0?`${f} 프레임`:"활동 없음");
      cc.append(cell);
    }
    row.append(dl,cc); cal.append(row);
  });
  const hoursWrap=el("div","cal-hours"); hoursWrap.append(el("div"));
  const hx=el("div","hx");
  for(let h=0;h<24;h++) hx.append(el("span",null,[0,6,12,18,23].includes(h)?String(h):""));
  hoursWrap.append(hx); cal.append(hoursWrap);
  $("#cal-hint").textContent=`셀 최대 ${calMax} 프레임/시간`;
  document.querySelectorAll(".cal-scale .cell[data-l]").forEach(sw=>{
    const l=+sw.dataset.l;
    sw.style.background = l===0 ? "var(--surface-3)" : `color-mix(in srgb, var(--accent) ${[0,30,52,74,100][l]}%, transparent)`;
  });

  const fmtMin = sec => { const m=Math.round(sec/60); const h=Math.floor(m/60);
    return h ? `${h}시간 ${m%60}분` : `${m}분`; };

  // 최근 날짜의 상위 5개 앱만 압축해서 보여준다. "탐색" 페이지의 하루 상세와
  // 데이터 출처(timeline API)는 같지만, 저건 아무 날이나 골라 보는 용도고
  // 이건 최근 날짜 고정 요약용이라 분리했다.
  async function loadTodayBars(date){
    const t = await fetch(`/api/timeline/${date}`).then(r=>r.json());
    const box=$("#todaybars"); box.innerHTML="";
    $("#todaybars-date").textContent = date.slice(5).replace("-",".");
    const entries = Object.entries(t.app_seconds).filter(([,s])=>s>=60).sort((a,b)=>b[1]-a[1]).slice(0,5);
    if(!entries.length){ box.append(el("div","hint","기록 없음")); return; }
    const maxSec = entries[0][1];
    entries.forEach(([a,sec])=>{
      const row=el("div","bar-row");
      const track=el("div","track"); const fill=el("div","fill");
      fill.style.width=(sec/maxSec*100)+"%"; fill.style.background=colorVar(a); track.append(fill);
      const val=el("div","val"); val.textContent=fmtMin(sec);
      row.append(el("div","name",lab(a)), track, val); box.append(row);
    });
  }
  loadTodayBars(D.dates.at(-1));
})();
</script>
