<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>screenlog · 탐색</title>
<meta name="description" content="화면 사용 패턴을 날짜·앱·시간대별로 들여다보는 화면.">
<meta property="og:title" content="screenlog · 탐색">
<meta property="og:description" content="화면 사용 패턴을 날짜·앱·시간대별로 들여다보는 화면.">
<meta property="og:image" content="http://43.202.158.8:8000/static/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='7' fill='%230d1013'/><rect x='7' y='13' width='5' height='5' rx='1.5' fill='%23f3f5f7'/><rect x='14' y='13' width='5' height='5' rx='1.5' fill='%237d858d'/><rect x='21' y='13' width='4' height='5' rx='1.5' fill='%23474d55'/></svg>">
<link rel="stylesheet" href="/static/tokens.css">
<style>
  *{ box-sizing:border-box; }
  body{ margin:0; background:var(--plane); color:var(--ink); font-family:var(--sans); line-height:1.5; -webkit-font-smoothing:antialiased; }
  .wrap{ max-width:960px; margin:0 auto; padding:0 24px; }
  main{ display:block; padding:40px 0 72px; }
  /* 내비/워드마크/버튼 공통 스타일은 tokens.css에 있다. */

  .tiles{ display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin:8px 0 20px; }
  @media(max-width:720px){ .tiles{ grid-template-columns:repeat(2,1fr);} }
  .tile{ background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:16px; }
  .tile .k{ font-family:var(--mono); font-size:11px; letter-spacing:.05em; color:var(--muted); text-transform:uppercase; }
  .tile .v{ font-size:24px; font-weight:640; letter-spacing:-.02em; line-height:1.2; margin-top:2px; }
  .tile .s{ font-size:12.5px; color:var(--muted); margin-top:3px; }

  section{ margin-top:16px; }
  .card{ background:var(--surface); border:1px solid var(--border); border-radius:14px; padding:20px 22px 22px; }
  .card-head{ display:flex; align-items:baseline; justify-content:space-between; gap:12px; flex-wrap:wrap; }
  .card h2{ font-size:15.5px; font-weight:620; margin:0; }
  .card .sub{ font-size:12.5px; color:var(--muted); margin:2px 0 16px; }
  .card .hint{ font-family:var(--mono); font-size:11px; color:var(--muted); }

  .legend{ display:flex; flex-wrap:wrap; gap:10px 16px; margin:2px 0 16px; }
  .legend .li{ display:flex; align-items:center; gap:7px; font-size:12.5px; color:var(--ink-2); }
  .sw{ width:11px; height:11px; border-radius:3px; flex:none; }

  /* 날짜별 스택 */
  .days{ display:flex; flex-direction:column; gap:8px; }
  .drow{ display:grid; grid-template-columns:64px 1fr 96px; align-items:center; gap:12px; padding:6px 8px; border-radius:9px;
         cursor:pointer; border:1px solid transparent; }
  .drow:hover{ background:var(--surface-2); }
  .drow.sel{ background:var(--surface-2); border-color:var(--border); }
  .drow .dl{ font-family:var(--mono); font-size:12px; color:var(--ink-2); }
  .drow .dl .wd{ color:var(--muted); margin-left:4px; }
  .dstack{ height:18px; display:flex; border-radius:5px; overflow:hidden; background:var(--surface-3); }
  .dstack span{ box-shadow: inset -1px 0 0 0 var(--surface); }
  .drow .dr{ font-family:var(--mono); font-size:12px; text-align:right; font-variant-numeric:tabular-nums; }
  .drow .dr .u{ color:var(--muted); font-size:11px; }

  /* 하루 상세 리본 */
  .ribbon-scroll{ overflow-x:auto; }
  .ribbon{ position:relative; height:52px; min-width:620px; border-radius:8px; overflow:hidden; background:var(--surface-3); }
  .blk{ position:absolute; top:0; bottom:0; box-shadow:inset -1px 0 0 0 var(--surface); }
  .axis{ position:relative; min-width:620px; height:18px; margin-top:6px; }
  .tick{ position:absolute; top:0; transform:translateX(-50%); font-family:var(--mono); font-size:10.5px; color:var(--muted); }
  .tick::before{ content:""; position:absolute; top:-8px; left:50%; width:1px; height:5px; background:var(--baseline); }

  /* 막대(앱별 사용 시간 / 편중) */
  .bars{ display:flex; flex-direction:column; gap:10px; }
  .bar-row{ display:grid; grid-template-columns:92px 1fr 72px; align-items:center; gap:12px; }
  .bar-row .name{ font-size:13px; color:var(--ink-2); text-align:right; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .track{ height:14px; background:var(--surface-3); border-radius:0 4px 4px 0; overflow:hidden; }
  .fill{ height:100%; border-radius:0 4px 4px 0; }
  .bar-row .val{ font-family:var(--mono); font-size:12.5px; text-align:right; font-variant-numeric:tabular-nums; }
  .bar-row .val .u{ color:var(--muted); font-size:11px; }
  .insight{ background:var(--surface-2); border:1px solid var(--border); border-left:3px solid var(--accent); border-radius:8px; padding:13px 15px; font-size:13.5px; color:var(--ink-2); line-height:1.55; margin-top:14px; }
  .insight b{ color:var(--ink); font-weight:600; }

  #tip{ position:fixed; z-index:50; pointer-events:none; opacity:0; transition:opacity .1s; background:var(--ink); color:var(--plane); font-size:12px; padding:7px 10px; border-radius:7px; box-shadow:0 6px 20px rgba(0,0,0,.28); }
  #tip .tt{ font-weight:600; }
  #tip .td{ font-family:var(--mono); opacity:.82; margin-top:2px; }
  footer{ margin-top:28px; font-family:var(--mono); font-size:11px; color:var(--muted); line-height:1.7; }
</style>
</head>
<body>
<header class="nav">
  <div class="wrap">
    <a class="mark" href="/">
      <span class="glyph"><i></i><i></i><i></i></span>
      screenlog
    </a>
    <nav class="navlinks">
      <a href="/dashboard">물어보기</a>
      <a href="/explore" class="on">탐색</a>
      <a class="btn btn-primary btn-sm" href="/download/">다운로드</a>
    </nav>
  </div>
</header>

<main>
<div class="wrap">
  <div class="tiles" id="tiles"></div>

  <section class="card">
    <div class="card-head"><h2>날짜별 앱 사용</h2><span class="hint">막대를 누르면 그날 상세로</span></div>
    <p class="sub">막대 길이는 그날 캡처된 프레임 수, 색은 앱입니다.</p>
    <div class="legend" id="legend"></div>
    <div class="days" id="days"></div>
  </section>

  <section class="card">
    <div class="card-head"><h2 id="detail-title">하루 상세</h2><span class="hint" id="detail-meta"></span></div>
    <p class="sub">앱 전환 리듬(리본)과 앱별 사용 시간. 캡처가 1장뿐인 이벤트가 93%라
       시작·끝이 같으므로, 다음 이벤트가 시작될 때까지 그 화면을 봤다고 봅니다(공백 2분 초과는 자리비움으로 제외).</p>
    <div class="ribbon-scroll"><div class="ribbon" id="ribbon"></div><div class="axis" id="axis"></div></div>
    <div style="height:16px"></div>
    <div class="bars" id="appbars"></div>
  </section>

  <section class="card">
    <div class="card-head"><h2>검색 후보 편중</h2><span class="hint" id="conc-hint"></span></div>
    <p class="sub">어느 앱이 검색 후보(이벤트)를 독식하는지 — 앱 필터가 왜 필요한지의 근거입니다.</p>
    <div class="bars" id="conc"></div>
    <div class="insight" id="conc-insight"></div>
  </section>

  <footer id="footer"></footer>
</div>
</main>

<div id="tip"><div class="tt"></div><div class="td"></div></div>

<script>
const LABEL = {"zoom.us":"Zoom","Google Chrome":"Chrome"};
const lab = a => LABEL[a] || a;
const $ = s => document.querySelector(s);
const el = (t,c,txt)=>{ const e=document.createElement(t); if(c)e.className=c; if(txt!=null)e.textContent=txt; return e; };
const pad2 = n => String(n).padStart(2,"0");
const esc = s => String(s??"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

let APP_SLOT = {};
const colorVar = a => APP_SLOT[a] || "var(--muted)";

const tip=$("#tip");
function showTip(e,t,d){ tip.querySelector(".tt").textContent=t; tip.querySelector(".td").textContent=d||""; tip.style.opacity=1; moveTip(e); }
function moveTip(e){ const p=14; let x=e.clientX+p,y=e.clientY+p; const r=tip.getBoundingClientRect();
  if(x+r.width>innerWidth-8)x=e.clientX-r.width-p; if(y+r.height>innerHeight-8)y=e.clientY-r.height-p;
  tip.style.left=x+"px"; tip.style.top=y+"px"; }
function bindTip(n,t,d){ n.addEventListener("mouseenter",e=>showTip(e,t,d)); n.addEventListener("mousemove",moveTip); n.addEventListener("mouseleave",()=>tip.style.opacity=0); }

(async ()=>{
  const D = await fetch("/api/stats").then(r=>r.json());
  if(!D.dates.length){ $("#footer").textContent="색인된 이벤트가 없습니다."; return; }

  D.apps.forEach((a,i)=>{ APP_SLOT[a] = i<8 ? `var(--app-${i+1})` : "var(--muted)"; });
  const TOP=D.apps.slice(0,8), TOPSET=new Set(TOP);
  const foldApp = a => TOPSET.has(a) ? a : "기타";

  // tiles
  const O=D.overall;
  const tiles=[
    {k:"검색 후보", v:O.total_events.toLocaleString(), s:`이벤트 · ${O.total_frames.toLocaleString()} 프레임`},
    {k:"기간", v:O.day_count+"일", s:`가장 바쁜 날 ${O.busiest_day.slice(5)}`},
    {k:"1위 앱", v:lab(O.top_app), s:`${O.top_app_frames.toLocaleString()} 프레임`},
    {k:"후보 편중", v:O.top_app_event_share+"%", s:`${lab(O.top_app)}가 차지`},
  ];
  const tilesEl=$("#tiles");
  tiles.forEach(t=>{ const c=el("div","tile"); c.append(el("div","k",t.k), el("div","v",t.v), el("div","s",t.s)); tilesEl.append(c); });

  // legend
  const legend=$("#legend");
  const legendApps = D.apps.length>8 ? [...TOP,"기타"] : TOP;
  legendApps.forEach(a=>{ const li=el("div","li"); const sw=el("span","sw"); sw.style.background=colorVar(a);
    li.append(sw, el("span",null,lab(a))); legend.append(li); });

  // 날짜별 스택
  const daysEl=$("#days");
  const maxFrames=Math.max(...D.per_day.map(d=>d.frames),1);
  D.per_day.forEach(d=>{
    const row=el("div","drow");
    const dl=el("div","dl"); dl.innerHTML=`${esc(d.date.slice(5))}<span class="wd">${esc(d.weekday_kr)}</span>`;

    // 상위 8개 밖의 앱은 '기타'로 접어서 색이 무한정 늘어나지 않게 한다.
    const folded={};
    for(const [a,f] of Object.entries(d.app_frames)) { const k=foldApp(a); folded[k]=(folded[k]||0)+f; }

    const stack=el("div","dstack");
    stack.style.width=(d.frames/maxFrames*100)+"%";
    Object.entries(folded).sort((a,b)=>b[1]-a[1]).forEach(([a,f])=>{
      const seg=el("span"); seg.style.width=(f/d.frames*100)+"%"; seg.style.background=colorVar(a);
      bindTip(seg, `${lab(a)} · ${d.date.slice(5)}`, `${f} 프레임`);
      stack.append(seg);
    });
    const wrap=el("div"); wrap.append(stack);
    const dr=el("div","dr"); dr.innerHTML=`${d.frames.toLocaleString()}<span class="u"> 프레임</span>`;
    row.append(dl,wrap,dr);

    // 날짜를 DOM에 직접 붙여둔다. 인덱스로 행을 찾으면 렌더 순서가 바뀔 때 어긋난다.
    row.dataset.date = d.date;
    row.addEventListener("click", ()=>selectDay(d));
    daysEl.append(row);
  });

  function selectDay(day){
    document.querySelectorAll(".drow.sel").forEach(r=>r.classList.remove("sel"));
    const row = daysEl.querySelector(`.drow[data-date="${day.date}"]`);
    if(row) row.classList.add("sel");
    loadTimeline(day);
  }

  // ---------- 하루 상세 (리본) ----------
  const fmtMin = sec => { const m=Math.round(sec/60); const h=Math.floor(m/60);
    return h ? `${h}시간 ${m%60}분` : `${m}분`; };
  const hhmm = sec => `${pad2(Math.floor(sec/3600))}:${pad2(Math.floor(sec%3600/60))}`;

  async function loadTimeline(day){
    const t = await fetch(`/api/timeline/${day.date}`).then(r=>r.json());
    const ribbon=$("#ribbon"), axis=$("#axis"), bars=$("#appbars");
    ribbon.innerHTML=""; axis.innerHTML=""; bars.innerHTML="";

    $("#detail-title").textContent = `${day.date} (${day.weekday_kr})`;

    if(!t.blocks.length){ $("#detail-meta").textContent="기록 없음"; return; }

    // 리본의 좌우 끝은 그날 첫 활동 ~ 마지막 활동. 하루 24시간을 다 그리면
    // 활동이 없는 새벽이 화면의 절반을 먹는다.
    const from=t.blocks[0].start_sec, to=t.blocks.at(-1).end_sec, span=to-from;
    const totalSec=Object.values(t.app_seconds).reduce((a,b)=>a+b,0);
    $("#detail-meta").textContent=`${hhmm(from)} ~ ${hhmm(to)} · 체류 ${fmtMin(totalSec)}`;

    for(const b of t.blocks){
      const blk=el("div","blk");
      blk.style.left=((b.start_sec-from)/span*100)+"%";
      blk.style.width=Math.max((b.end_sec-b.start_sec)/span*100, 0.2)+"%";
      blk.style.background=colorVar(b.app);
      bindTip(blk, lab(b.app), `${hhmm(b.start_sec)} ~ ${hhmm(b.end_sec)}`);
      ribbon.append(blk);
    }

    // 눈금은 정시마다. 폭이 좁으면 2~3시간 간격으로 띄운다.
    const step = span > 6*3600 ? 2 : 1;
    for(let h=Math.ceil(from/3600); h*3600<=to; h+=step){
      const tick=el("div","tick", h+"시");
      tick.style.left=((h*3600-from)/span*100)+"%";
      axis.append(tick);
    }

    const maxSec=Math.max(...Object.values(t.app_seconds),1);
    Object.entries(t.app_seconds).forEach(([a,sec])=>{
      if(sec < 60) return;                     // 1분 미만은 표에서 뺀다
      const row=el("div","bar-row");
      const track=el("div","track"); const fill=el("div","fill");
      fill.style.width=(sec/maxSec*100)+"%"; fill.style.background=colorVar(a); track.append(fill);
      const val=el("div","val"); val.textContent=fmtMin(sec);
      row.append(el("div","name",lab(a)), track, val); bars.append(row);
    });
  }

  // 처음엔 가장 바쁜 날을 열어둔다. 빈 리본으로 시작하면 이 섹션이 뭘 하는지 안 보인다.
  selectDay(D.per_day.find(d=>d.date===O.busiest_day) || D.per_day.at(-1));

  // 편중
  const conc=$("#conc");
  const concMax=Math.max(...Object.values(D.app_events),1);
  Object.entries(D.app_events).slice(0,8).forEach(([a,n])=>{
    const row=el("div","bar-row");
    const track=el("div","track"); const fill=el("div","fill");
    fill.style.width=(n/concMax*100)+"%"; fill.style.background=colorVar(a); track.append(fill);
    const val=el("div","val"); val.innerHTML=`${n.toLocaleString()}<span class="u"> 개</span>`;
    row.append(el("div","name",lab(a)), track, val); conc.append(row);
  });
  $("#conc-hint").textContent=`이벤트 ${O.total_events.toLocaleString()}개`;
  $("#conc-insight").innerHTML =
    `<b>${esc(lab(O.top_app))}</b>가 검색 후보의 <b>${O.top_app_event_share}%</b>를 차지합니다. ` +
    `앱 이름은 임베딩 공간에 축이 없어서, 필터 없이 검색하면 후보가 많은 앱이 상위를 독식합니다 — ` +
    `그래서 라우팅이 <b>app</b> 필터를 먼저 뽑습니다.`;

  $("#footer").textContent =
    `이벤트 ${O.total_events.toLocaleString()}개 · 프레임 ${O.total_frames.toLocaleString()}개 · ${D.dates[0]} ~ ${D.dates.at(-1)} · 로컬에서만 실행됩니다`;
})();
</script>
</body>
</html>
