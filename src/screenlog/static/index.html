<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>screenlog</title>
<style>
  :root{
    color-scheme: light;
    --plane:#eef1f4; --surface:#fff; --surface-2:#f7f9fb; --surface-3:#eef2f5;
    --ink:#0d1013; --ink-2:#4a5158; --muted:#7d858d;
    --baseline:#ccd3da; --border:rgba(13,16,19,.09);
    --accent:#2a78d6; --warn:#c2740b; --warn-bg:#fdf3e3;
    --mono: ui-monospace,"SF Mono",Menlo,Consolas,monospace;
    --sans: system-ui,-apple-system,"Apple SD Gothic Neo","Segoe UI",sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{
      color-scheme: dark;
      --plane:#0b0c0e; --surface:#17181b; --surface-2:#1d1f23; --surface-3:#26292e;
      --ink:#f3f5f7; --ink-2:#b7bec6; --muted:#828a92;
      --baseline:#383c42; --border:rgba(255,255,255,.10);
      --accent:#3987e5; --warn:#e5a53a; --warn-bg:#2e2413;
    }
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; min-height:100vh; background:var(--plane); color:var(--ink);
    font-family:var(--sans); line-height:1.5; -webkit-font-smoothing:antialiased;
    display:flex; align-items:center; justify-content:center;
  }
  .wrap{ max-width:640px; margin:0 auto; padding:64px 24px; text-align:center; }

  .eyebrow{
    font-family:var(--mono); font-size:12px; letter-spacing:.06em; color:var(--muted);
    text-transform:uppercase; margin:0 0 14px; display:flex; gap:10px; align-items:center;
    justify-content:center;
  }
  .eyebrow .dot{ width:6px;height:6px;border-radius:50%;background:var(--accent); }

  h1{ font-size:clamp(28px,5vw,42px); line-height:1.15; margin:0 0 14px; letter-spacing:-.02em; font-weight:650; }
  .lede{ font-size:16px; color:var(--ink-2); margin:0 auto 36px; max-width:46ch; }

  .actions{ display:flex; gap:12px; justify-content:center; flex-wrap:wrap; margin-bottom:44px; }
  .btn{
    display:inline-flex; align-items:center; gap:8px; padding:13px 22px;
    border-radius:10px; font-size:14.5px; font-weight:620; text-decoration:none;
    border:1px solid transparent; cursor:pointer;
  }
  .btn-primary{ background:var(--accent); color:white; }
  .btn-secondary{ background:var(--surface); color:var(--ink); border-color:var(--border); }

  .features{ display:grid; grid-template-columns:repeat(3,1fr); gap:14px; text-align:left; }
  @media(max-width:560px){ .features{ grid-template-columns:1fr; } }
  .feature{ background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:16px; }
  .feature .k{ font-family:var(--mono); font-size:11px; letter-spacing:.05em; color:var(--accent); text-transform:uppercase; margin-bottom:6px; }
  .feature .v{ font-size:13.5px; color:var(--ink-2); }
</style>
</head>
<body>
  <div class="wrap">
    <p class="eyebrow"><span class="dot"></span>screenlog</p>
    <h1>화면에 남긴 하루가<br>물어보면 답이 되도록</h1>
    <p class="lede">
      개인정보는 자동으로 가려서 저장하고, 화면 활동을 검색하고 물어볼 수
      있게 만드는 개인용 기록 도구입니다.
    </p>

    <div class="actions">
      <a class="btn btn-primary" href="/download/">앱 다운로드</a>
      <a class="btn btn-secondary" href="/dashboard">대시보드 보기</a>
    </div>

    <div class="features">
      <div class="feature">
        <div class="k">기록</div>
        <div class="v">화면 활동을 자동으로 캡처하고 이벤트 단위로 정리합니다.</div>
      </div>
      <div class="feature">
        <div class="k">보호</div>
        <div class="v">이메일·전화번호·API 키 같은 민감정보는 저장 전에 가려집니다.</div>
      </div>
      <div class="feature">
        <div class="k">검색</div>
        <div class="v">"어제 뭐 했어?"처럼 물어보면 근거와 함께 답합니다.</div>
      </div>
    </div>
  </div>
</body>
</html>
