name: Build and Deploy

on:
  push:
    branches: [main]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Debug network reachability
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          echo "runner egress IP:"
          curl -s https://checkip.amazonaws.com || true
          echo "TCP 22:"
          timeout 10 bash -c "cat < /dev/null > /dev/tcp/$EC2_HOST/22" && echo "PORT 22 OPEN" || echo "PORT 22 FAILED"
          echo "TCP 8000:"
          timeout 10 bash -c "cat < /dev/null > /dev/tcp/$EC2_HOST/8000" && echo "PORT 8000 OPEN" || echo "PORT 8000 FAILED"

      - name: SSH into EC2 and redeploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          timeout: 60s
          script: |
            set -e
            cd /home/ubuntu/screenlog
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull
            docker compose up -d
            docker image prune -af
